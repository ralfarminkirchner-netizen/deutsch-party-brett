<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="darkreader-lock">
  <meta name="description" content="Deutsch Party Brett — Das lustige Lernspiel für die Grundschule!">
  <meta name="theme-color" content="#beddba">
  <title>Deutsch Party Brett</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/screens/setup.css">
  <link rel="stylesheet" href="css/screens/minigame.css">
  <link rel="stylesheet" href="css/screens/results.css">

  <!-- PASTEL GREEN LIGHT LOCK -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background-color: #beddba !important;
      color-scheme: only light !important;
      forced-color-adjust: none !important;
      font-family: 'Nunito', system-ui, sans-serif;
    }

    /* Core Screen Management */
    .screen {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      flex-direction: column;
      background-color: #beddba !important;
      overflow: hidden;
    }
    .screen.active {
      display: flex !important;
    }
    /* board-screen: row layout */
    .board-screen, .board-screen.active {
      flex-direction: row !important;
    }
    /* board-content fills the board-screen */
    #board-content {
      display: flex !important;
      flex-direction: row !important;
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
    }

    @media (max-width: 760px) {
      #board-content {
        flex-direction: row !important;
      }
      #board-content .board-area {
        min-height: 100vh !important;
        height: 100vh !important;
      }
      .turn-bar {
        top: 10px !important;
        left: 10px !important;
        transform: scale(0.82);
        transform-origin: top left;
      }
    }
  </style>

  <!-- Fonts -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #beddba !important;
      color-scheme: only light !important;
      forced-color-adjust: none !important;
      font-family: 'Nunito', system-ui, sans-serif;
    }
    .screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; flex-direction: column; background-color: #beddba !important; overflow: hidden; }
    .screen.active { display: flex !important; }
    .board-screen, .board-screen.active { flex-direction: row !important; }
    #board-content { display: flex !important; flex-direction: row !important; position: absolute !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; overflow: hidden !important; }
    @media (max-width: 760px) {
      #board-content { flex-direction: row !important; }
      #board-content .board-area { min-height: 100vh !important; height: 100vh !important; }
      .turn-bar { top: 10px !important; left: 10px !important; transform: scale(0.82); transform-origin: top left; }
    }
  </style>

  <!-- App -->
  <script type="module" src="js/app.js"></script>
</head>
<body>

  <!-- START SCREEN -->
  <div id="screen-start" class="screen start-screen" style="
    background: linear-gradient(160deg, #e8f5e9 0%, #f3e5f5 100%);
    background-size: cover;
    background-position: center;
    align-items: center;
    justify-content: center;
  ">
    <div style="
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 50px 60px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      max-width: 700px;
      width: 90%;
    ">
      <h1 style="
        font-family: 'Fredoka One', cursive;
        font-size: clamp(56px, 8vw, 100px);
        color: #1b5e20;
        margin: 0 0 10px;
        line-height: 1;
        text-shadow: 3px 3px 0 rgba(255,255,255,0.5);
      ">Deutsch<br>Party Brett</h1>
      <p style="
        font-family: 'Nunito', sans-serif;
        font-size: clamp(22px, 3vw, 36px);
        font-weight: 800;
        color: #388e3c;
        margin: 0 0 40px;
      ">Spielend Deutsch lernen!</p>
      <div style="display:flex; flex-direction:column; gap:20px; align-items:stretch;">
        <button id="btn-new-game" type="button" style="
          font-family: 'Fredoka One', cursive;
          font-size: clamp(32px, 4vw, 56px);
          background: linear-gradient(135deg, #FF6B6B, #FF3366);
          color: white;
          border: none;
          border-radius: 100px;
          padding: 24px 60px;
          cursor: pointer;
          box-shadow: 0 8px 0 #c62828, 0 12px 20px rgba(255,51,102,0.4);
          transition: transform 0.1s, box-shadow 0.1s;
        " onmousedown="this.style.transform='translateY(4px)'; this.style.boxShadow='0 4px 0 #c62828'"
          onmouseup="this.style.transform=''; this.style.boxShadow='0 8px 0 #c62828, 0 12px 20px rgba(255,51,102,0.4)'">
          Neues Spiel
        </button>
        <button id="btn-continue" type="button" disabled style="
          font-family: 'Fredoka One', cursive;
          font-size: clamp(24px, 3vw, 40px);
          background: linear-gradient(135deg, #66BB6A, #388e3c);
          color: white;
          border: none;
          border-radius: 100px;
          padding: 18px 50px;
          cursor: pointer;
          box-shadow: 0 6px 0 #1b5e20, 0 10px 16px rgba(56,142,60,0.4);
          transition: transform 0.1s;
          opacity: 0.45;
        ">Fortsetzen</button>
        <button id="btn-lobby" type="button" style="
          font-family: 'Fredoka One', cursive;
          font-size: clamp(20px, 2.5vw, 32px);
          background: linear-gradient(135deg, #42A5F5, #1E88E5);
          color: white;
          border: none;
          border-radius: 100px;
          padding: 14px 40px;
          cursor: pointer;
          box-shadow: 0 5px 0 #1565C0;
        ">Party-Lobby</button>
        <button id="btn-profiles" type="button" style="
          font-family: 'Nunito', sans-serif;
          font-size: clamp(18px, 2vw, 24px);
          font-weight: 800;
          background: rgba(0,0,0,0.08);
          color: #555;
          border: none;
          border-radius: 100px;
          padding: 12px 32px;
          cursor: pointer;
        ">Profile</button>
      </div>
    </div>
  </div>

  <!-- SETUP SCREEN -->
  <div id="screen-setup" class="screen setup-screen">
    <div id="setup-content" style="width:100%;height:100%;overflow:auto;"></div>
  </div>

  <!-- BOARD SCREEN: board-content is the render target for BoardRenderer -->
  <div id="screen-board" class="screen board-screen" style="
    background-image: url('assets/img/backgrounds/magical_forest.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  ">
    <div id="board-content"></div>
  </div>

  <!-- MINIGAME SCREEN -->
  <div id="screen-minigame" class="screen minigame-screen">
    <div id="minigame-content" style="width:100%;height:100%;"></div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="screen-results" class="screen results-screen">
    <div id="results-content" style="width:100%;height:100%;overflow:auto;"></div>
  </div>

  <!-- NO MASCOT LOADER: caused 44-image grid blocking buttons -->
</body>
</html>
